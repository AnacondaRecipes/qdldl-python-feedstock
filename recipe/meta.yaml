{% set name = "qdldl-python" %}
# Versions must be the same for the libqdldl and qdldl-python
{% set libqdldl_version = "0.1.9" %}
{% set version = "0.1.9.post1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/osqp/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 6f04bed33f6369610e35b4ca73fdb860dbb7e1b6b67eb678fc09a6d581d630fc
  patches:
    - patches/0001-build-against-conda-forge-s-libqdldl.patch
    - patches/0002-build-qdldlamd-as-shared-lib-and-install-it.patch
    - patches/0003-Do-not-pass-CMAKE_GENERATOR-as-variable.patch

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja-base
  host:
    - pip
    - python
    - wheel
    - setuptools >=49.5.0
    # unvendored libqdldl - version has to match upstream pinned submodule
    - libqdldl {{ libqdldl_version }}
    - numpy {{ numpy  }}
    - pybind11 =3.0.4
  run:
    - python
    - numpy >=1.7
    - scipy >=0.13.2

test:
  source_files:
    - tests
  imports:
    - qdldl
  commands:
    - pip check
    - test -f ${PREFIX}/lib/libqdldlamd${SHLIB_EXT}  # [unix]
    - if not exist %PREFIX%\\Library\\bin\\qdldlamd.dll exit 1  # [win]
    - if not exist %PREFIX%\\Library\\lib\\qdldlamd.lib exit 1  # [win]
    - pytest -v tests
  requires:
    - pytest
    - pip

about:
  home: https://github.com/osqp/qdldl-python
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Python interface to the QDLDL free LDL factorization routine for quasi-definite linear systems
  description: |
    Python interface to the [QDLDL](https://github.com/osqp/qdldl) free
    LDL factorization routine for quasi-definite linear systems: `Ax = b`.
  dev_url: https://github.com/osqp/qdldl-python
  doc_url: https://github.com/osqp/qdldl-python/blob/master/README.md

extra:
  recipe-maintainers:
    - bstellato
    - gbanjac
    - h-vetinari
